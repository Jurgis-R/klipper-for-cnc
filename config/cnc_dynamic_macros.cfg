# Dynamic CNC helper macros for 3DCoded/DynamicMacros.
# Copy this file into the same directory as printer.cfg.
# Load it through [dynamicmacros] configs: cnc_dynamic_macros.cfg.
#
# Edit defaults here and run DYNAMIC_MACRO to reload without a Klipper restart.
# Or change values live with SET_DYNAMIC_VARIABLE (see docs/CNC_Dynamic_Macros.md).
# These wrappers call the CNC_FIND_ROTATION command supplied by klippy/extras/cnc_probe.py.

[gcode_macro CNC_ROTATION]
variable_side: "Y_MIN"
variable_x_start: 20.0
variable_x_end: 220.0
variable_y_start: 20.0
variable_y_end: 220.0
variable_outside: 10.0
variable_z: 5.0
variable_safe_z: 20.0
variable_step: 20.0
variable_probe_depth: 5.0
variable_feed: 60.0
variable_apply: 0
gcode:
  {% set side = params.SIDE|default(side)|string|upper %}
  {% set x_start = params.X_START|default(x_start)|float %}
  {% set x_end = params.X_END|default(x_end)|float %}
  {% set y_start = params.Y_START|default(y_start)|float %}
  {% set y_end = params.Y_END|default(y_end)|float %}
  {% set outside = params.OUTSIDE|default(outside)|float %}
  {% set z = params.Z|default(z)|float %}
  {% set safe_z = params.SAFE_Z|default(safe_z)|float %}
  {% set step = params.STEP|default(step)|float %}
  {% set probe_depth = params.PROBE_DEPTH|default(probe_depth)|float %}
  {% set feed = params.F|default(feed)|float %}
  {% set apply = params.APPLY|default(apply)|int %}
  {% if side not in ["X_MIN", "X_MAX", "Y_MIN", "Y_MAX"] %}
    { action_raise_error("CNC_ROTATION SIDE must be X_MIN, X_MAX, Y_MIN or Y_MAX") }
  {% elif side.startswith("Y_") %}
    CNC_FIND_ROTATION SIDE={side} X_START={x_start} X_END={x_end} OUTSIDE={outside} Z={z} SAFE_Z={safe_z} STEP={step} PROBE_DEPTH={probe_depth} F={feed} APPLY={apply}
  {% else %}
    CNC_FIND_ROTATION SIDE={side} Y_START={y_start} Y_END={y_end} OUTSIDE={outside} Z={z} SAFE_Z={safe_z} STEP={step} PROBE_DEPTH={probe_depth} F={feed} APPLY={apply}
  {% endif %}

[gcode_macro CNC_ROTATION_PREVIEW]
gcode:
  RESPOND TYPE=echo MSG="CNC rotation defaults are stored on CNC_ROTATION."
  RESPOND TYPE=echo MSG="Example live edit: SET_DYNAMIC_VARIABLE MACRO=CNC_ROTATION VARIABLE=step VALUE=10.0"
  RESPOND TYPE=echo MSG="Measure only with CNC_ROTATION APPLY=0; inspect the report before applying G68."
